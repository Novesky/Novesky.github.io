name: rebuild holidays

on:
  schedule:
    - cron: "0 6 * * 0"   # weekly
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install icalendar requests pyyaml
      - run: python build.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add custom_holidays.ics
          git commit -m "refresh holidays" || exit 0
          git push
